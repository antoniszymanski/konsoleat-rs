[package]
name = "konsoleat"
version = "1.0.2"
edition = "2024"
description = "A tool that activates or creates a Konsole terminal session in a specified working directory"
repository = "https://github.com/antoniszymanski/konsoleat-rs"
license = "MPL-2.0"

[dependencies]
askama = "0.15.1"
clap = { version = "4.5.53", features = ["derive", "string"] }
serde = { version = "1.0.228", features = ["derive"] }
snafu = "0.8.9"
tempfile = "3.24.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
zbus = { version = "5.12.0", default-features = false, features = ["tokio"] }
zbus_xml = "5.0.2"

[profile.release]
lto = true
codegen-units = 1
