[package]
name = "konsoleat"
version = "2.1.3"
edition = "2024"
description = "A tool that activates or creates a Konsole terminal session in a specified working directory"
repository = "https://github.com/antoniszymanski/konsoleat-rs"
license = "MPL-2.0"

[dependencies]
askama = "0.16.0"
clap = { version = "4.5.53", features = ["derive"] }
heapless = "0.9.4"
procfs = { version = "0.18.0", default-features = false }
same-file = "1.0.6"
snafu = "0.9.0"
tempfile = "3.24.0"
zbus = "6.0.0"
zbus_xml = "6.0.0"

[build-dependencies]
build-rs = "0.3.6"
clap = { version = "4.5.53", features = ["derive"] }
clap_complete_command = { version = "0.6.1", features = ["carapace", "nushell"] }
clap_mangen = "0.3.3"
remove_dir_all = "1.0.0"

[profile.release]
lto = true
codegen-units = 1
