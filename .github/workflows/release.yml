name: release

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: Version bump type
        required: true
        type: choice
        options: [major, minor, patch, auto]
        default: auto

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      ref: refs/tags/v${{ steps.version.outputs.output }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Batch changes
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: batch ${{ inputs.bump-type }}

      - name: Merge changes
        run: changie merge

      - name: Get the latest version
        id: version
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest --remove-prefix

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Set the version in Cargo.toml
        run: cargo set-version ${{ steps.version.outputs.output }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release v${{ steps.version.outputs.output }}"

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Push
        run: git push

      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          ref: refs/tags/v${{ steps.version.outputs.output }}
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            build-tool: cargo
          - target: x86_64-unknown-linux-musl
            build-tool: cross
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.ref }}

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-outdir
            ${{ matrix.build-tool != 'cargo' && matrix.build-tool || '' }}

      - name: Resolve Cargo output directory
        id: cargo-outdir
        shell: bash
        run: |
          out_dir=$(cargo outdir --no-names)
          echo "out-dir=$out_dir" >> "$GITHUB_OUTPUT"

      - name: Compile and release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: konsoleat
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          ref: ${{ needs.create-release.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          include: |
            ${{ steps.cargo-outdir.outputs.out-dir }}/completions
            ${{ steps.cargo-outdir.outputs.out-dir }}/man
